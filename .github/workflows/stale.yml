# 自动标记和关闭过期 Issues/PRs
# Automatically mark and close stale Issues/PRs

name: Mark Stale Issues and PRs

on:
  schedule:
    # 每天 UTC 时间 1:00 运行 (北京时间 9:00)
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Issue 设置
          stale-issue-message: |
            👋 这个 Issue 已经 60 天没有活动了。

            如果问题仍然存在，请回复此消息以保持 Issue 开放。
            如果没有进一步的活动，这个 Issue 将在 14 天后自动关闭。

            ---

            👋 This issue has been automatically marked as stale because it has not had activity in 60 days.

            If the issue is still relevant, please reply to this message to keep it open.
            It will be closed automatically in 14 days if there is no further activity.

          close-issue-message: |
            🔒 这个 Issue 因长期不活跃已被自动关闭。

            如果问题仍然存在，欢迎重新打开或创建新的 Issue。

            ---

            🔒 This issue has been automatically closed due to inactivity.

            If the issue still exists, feel free to reopen or create a new issue.

          stale-issue-label: "stale"
          days-before-issue-stale: 60
          days-before-issue-close: 14

          # PR 设置
          stale-pr-message: |
            👋 这个 Pull Request 已经 30 天没有活动了。

            请更新你的 PR 或回复此消息以保持其开放。
            如果没有进一步的活动，这个 PR 将在 14 天后自动关闭。

            ---

            👋 This PR has been automatically marked as stale because it has not had activity in 30 days.

            Please update your PR or reply to this message to keep it open.
            It will be closed automatically in 14 days if there is no further activity.

          close-pr-message: |
            🔒 这个 PR 因长期不活跃已被自动关闭。

            如果你仍想合并这些更改，欢迎重新打开或创建新的 PR。

            ---

            🔒 This PR has been automatically closed due to inactivity.

            If you still want to merge these changes, feel free to reopen or create a new PR.

          stale-pr-label: "stale"
          days-before-pr-stale: 30
          days-before-pr-close: 14

          # 排除项
          exempt-issue-labels: "pinned,security,help wanted,good first issue"
          exempt-pr-labels: "pinned,security,work in progress"

          # 只处理 Issues 和 PRs，不处理 Draft PRs
          exempt-draft-pr: true
