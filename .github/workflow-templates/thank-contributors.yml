# 感谢贡献者
# Thank contributors

name: Thank Contributors

on:
  pull_request_target:
    types: [closed]

permissions:
  pull-requests: write

jobs:
  thank:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const author = context.payload.pull_request.user.login;
            const prNumber = context.payload.pull_request.number;

            // 检查是否是 bot
            if (author.includes('[bot]') || author === 'dependabot') {
              return;
            }

            const message = `
            🎉 **感谢你的贡献！ Thank you for your contribution!**

            你的 PR #${prNumber} 已成功合并！

            Your PR #${prNumber} has been successfully merged!

            ---

            💖 如果你喜欢这个项目，请考虑给我们一个 ⭐

            💖 If you like this project, please consider giving us a ⭐
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: message
            });
