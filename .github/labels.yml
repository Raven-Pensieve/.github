# 组织标准标签定义
# Organization standard label definitions
# 使用 github-label-sync 或类似工具同步标签

# === 类型标签 Type Labels ===
- name: bug
  color: "d73a4a"
  description: "Something isn't working | 发现了 bug"

- name: enhancement
  color: "a2eeef"
  description: "New feature or request | 新功能或请求"

- name: documentation
  color: "0075ca"
  description: "Improvements or additions to documentation | 文档改进"

- name: question
  color: "d876e3"
  description: "Further information is requested | 需要更多信息"

- name: security
  color: "ee0701"
  description: "Security related issue | 安全相关问题"

# === 状态标签 Status Labels ===
- name: "wontfix"
  color: "ffffff"
  description: "This will not be worked on | 不会处理"

- name: duplicate
  color: "cfd3d7"
  description: "This issue or PR already exists | 重复的问题或 PR"

- name: invalid
  color: "e4e669"
  description: "This doesn't seem right | 无效的问题"

- name: stale
  color: "fef2c0"
  description: "No recent activity | 长期无活动"

- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed | 需要帮助"

- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers | 适合新手"

- name: "work in progress"
  color: "fbca04"
  description: "Work in progress | 进行中"

- name: blocked
  color: "b60205"
  description: "Blocked by other issues | 被其他问题阻塞"

- name: "needs review"
  color: "0e8a16"
  description: "Needs code review | 需要代码审查"

- name: "needs info"
  color: "d93f0b"
  description: "Needs more information | 需要更多信息"

# === 优先级标签 Priority Labels ===
- name: "priority: critical"
  color: "b60205"
  description: "Critical priority | 紧急优先级"

- name: "priority: high"
  color: "d93f0b"
  description: "High priority | 高优先级"

- name: "priority: medium"
  color: "fbca04"
  description: "Medium priority | 中优先级"

- name: "priority: low"
  color: "0e8a16"
  description: "Low priority | 低优先级"

# === 类别标签 Category Labels ===
- name: dependencies
  color: "0366d6"
  description: "Pull requests that update a dependency file | 依赖更新"

- name: ci
  color: "5319e7"
  description: "CI/CD related changes | CI/CD 相关"

- name: performance
  color: "d4c5f9"
  description: "Performance improvements | 性能优化"

- name: refactor
  color: "c5def5"
  description: "Code refactoring | 代码重构"

- name: tests
  color: "bfd4f2"
  description: "Test related changes | 测试相关"

- name: styles
  color: "ffc0cb"
  description: "UI/Styling changes | 样式更改"

# === 特殊标签 Special Labels ===
- name: breaking-change
  color: "b60205"
  description: "Breaking changes | 破坏性更改"

- name: pinned
  color: "006b75"
  description: "Pinned issue | 置顶问题"

- name: "ignore-for-release"
  color: "ededed"
  description: "Ignore for release notes | 忽略发布说明"
