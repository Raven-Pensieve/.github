# 自动生成 Release Notes 的配置
# Configuration for automatically generated release notes

changelog:
  exclude:
    labels:
      - ignore-for-release
      - duplicate
      - invalid
    authors:
      - dependabot
      - github-actions

  categories:
    - title: 🚀 新功能 | New Features
      labels:
        - enhancement
        - feature

    - title: 🐛 Bug 修复 | Bug Fixes
      labels:
        - bug
        - fix

    - title: 📚 文档 | Documentation
      labels:
        - documentation

    - title: 🔧 维护 | Maintenance
      labels:
        - maintenance
        - chore
        - refactor

    - title: ⚡ 性能优化 | Performance
      labels:
        - performance

    - title: 🔒 安全 | Security
      labels:
        - security

    - title: 💥 破坏性更改 | Breaking Changes
      labels:
        - breaking-change
        - breaking

    - title: 📦 依赖更新 | Dependencies
      labels:
        - dependencies

    - title: 🎨 样式 | Styling
      labels:
        - styles
        - ui

    - title: 🧪 测试 | Tests
      labels:
        - tests

    - title: 🏷️ 其他更改 | Other Changes
      labels:
        - "*"
