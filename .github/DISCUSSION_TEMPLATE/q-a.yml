title: "[Q&A] "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        ## ❓ 提问 | Ask a Question

        在提问之前，请确保你已经：
        Before asking, please make sure you have:

        - 📖 查阅了[文档](https://docs.ravenhogwarts.top) | Checked the [documentation](https://docs.ravenhogwarts.top)
        - 🔍 搜索了现有的 Issues 和 Discussions | Searched existing Issues and Discussions

  - type: textarea
    id: question
    attributes:
      label: 问题 | Question
      description: 清晰地描述你的问题 | Clearly describe your question
      placeholder: |
        你想问什么？
        What is your question?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 背景 | Context
      description: 提供相关背景信息 | Provide relevant context
      placeholder: |
        描述你正在尝试做什么，以及遇到了什么困难...
        Describe what you're trying to do and what difficulties you encountered...
    validations:
      required: false

  - type: dropdown
    id: category
    attributes:
      label: 问题类别 | Question Category
      description: 选择最相关的类别 | Select the most relevant category
      options:
        - 使用问题 | Usage
        - 配置问题 | Configuration
        - 兼容性问题 | Compatibility
        - 功能咨询 | Feature Inquiry
        - 其他 | Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 插件版本 | Plugin Version
      description: 你使用的插件版本 | Plugin version you're using
      placeholder: "e.g., 1.0.0"
    validations:
      required: false
