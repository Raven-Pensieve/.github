title: "[Idea] "
labels:
  - idea
body:
  - type: markdown
    attributes:
      value: |
        ## 💡 分享你的想法 | Share Your Idea

        感谢你分享想法！请填写以下信息。
        Thanks for sharing your idea! Please fill in the following information.

  - type: textarea
    id: idea
    attributes:
      label: 想法描述 | Idea Description
      description: 描述你的想法 | Describe your idea
      placeholder: |
        清晰简洁地描述你的想法...
        Clearly and concisely describe your idea...
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: 动机 | Motivation
      description: 为什么这个想法很重要？ | Why is this idea important?
      placeholder: |
        解释这个想法能解决什么问题或带来什么价值...
        Explain what problem this idea solves or what value it brings...
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 其他信息 | Additional Information
      description: 任何其他相关信息 | Any other relevant information
      placeholder: |
        添加任何其他上下文、截图或参考资料...
        Add any other context, screenshots, or references...
    validations:
      required: false
